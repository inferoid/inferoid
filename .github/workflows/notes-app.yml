name: notes-app
# Builds the Inferoid Mac app on a GitHub Mac, so nobody needs Xcode. Tag notes-v* to publish a release.
on:
  push:
    branches: [main, staging]
    tags: ["notes-v*"]
    paths: ["apps/notes/**", ".github/workflows/notes-app.yml"]
  pull_request:
    paths: ["apps/notes/**", ".github/workflows/notes-app.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile (full errors)
        run: cd apps/notes && swift build -c release
      - name: Unit tests
        run: cd apps/notes && swift test
      - name: Build the app
        run: apps/notes/build-app.sh
      - name: Zip
        run: |
          cd apps/notes/build
          ditto -c -k --keepParent "Inferoid.app" InferoidNotes.zip
          shasum -a 256 InferoidNotes.zip | tee InferoidNotes.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: InferoidNotes
          path: apps/notes/build/InferoidNotes.zip*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/notes-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apps/notes/build/InferoidNotes.zip apps/notes/build/InferoidNotes.zip.sha256 --title "Inferoid ${GITHUB_REF_NAME#notes-v}" --notes "Inferoid for Mac: meeting notes and a private brain across your meetings. Install with: inferoid add notes"
