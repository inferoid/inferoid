name: desktop
# Builds the Windows app (Tauri: Rust core + React UI) on a GitHub Windows machine: tests, then an NSIS installer.
# On a notes-v* tag it also attaches Inferoid-Setup.exe (+ .sha256) to that release, next to the Mac zip. Not signed yet.
on:
  push:
    branches: [main, staging]
    tags: ["notes-v*"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: UI tests and build
        run: |
          pnpm test
          pnpm build
      - name: Rust tests
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Version from the release tag
        if: startsWith(github.ref, 'refs/tags/notes-v')
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.GITHUB_REF_NAME.replace('notes-v','');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
      - name: Installer
        run: pnpm tauri build --bundles nsis
      - name: Name the installer
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Inferoid-Setup.exe
          sha256sum Inferoid-Setup.exe | awk '{print $1"  Inferoid-Setup.exe"}' > Inferoid-Setup.exe.sha256
          cat Inferoid-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Inferoid-Windows
          path: |
            apps/desktop/Inferoid-Setup.exe
            apps/desktop/Inferoid-Setup.exe.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/notes-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Mac job creates the release after notarizing; wait for it (up to 60 min), then add the installer.
          for i in $(seq 1 120); do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 30; done
          gh release upload "$GITHUB_REF_NAME" Inferoid-Setup.exe Inferoid-Setup.exe.sha256 --clobber
          gh release edit "$GITHUB_REF_NAME" --notes "Inferoid for Mac (Inferoid.zip) and Windows (Inferoid-Setup.exe, NVIDIA GPU with 8 GB+). Private meeting notes and a brain across your meetings, running on your own computer."
